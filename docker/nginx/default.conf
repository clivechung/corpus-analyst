map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream query_engine {
    server query-engine:8000;
}

upstream streamlit {
    server streamlit:8501;
}

server {
    listen 80;
    server_name localhost;

    # Unified Ingress Health Check
    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx-ingress"}\n';
    }

    # REST Query Engine API Routing
    location /api/ {
        proxy_pass http://query_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Streamlit Internal WebSocket and Core Endpoints
    location /_stcore/ {
        proxy_pass http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Streamlit Web UI Root
    location / {
        proxy_pass http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

