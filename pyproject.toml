[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpus-analyst"
version = "0.1.0"
description = "Containerized corpus analysis and RAG system for diverse domains powered by DuckDB lakehouse, LangGraph, and Ragas."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Clive Chung", email = "clive.km.chung@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "duckdb>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyarrow>=16.0.0",
    "sentence-transformers>=3.0.0",
    "unstructured>=0.14.0",
    "google-genai>=0.1.0",
    "langgraph>=0.1.0",
    "ragas>=0.1.9",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "azure-storage-blob>=12.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:unstructured.*",
]

